<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rescue 2 Home Animal Support</title>
    
    <!-- Critical Asset Preloading -->
    <link rel="preload" href="style.css" as="style">
    <link rel="preload" href="https://images.unsplash.com/photo-1548767797-d8c844163c4c?auto=format&fit=crop&w=800&q=60" as="image">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- TOP APP NOTICE -->
    <div class="app-notice" id="appNotice">
        <div class="container">
            <div class="app-notice-inner">
                <span class="app-notice-icon">🐾</span>
                <div class="app-notice-text">
                    <strong>Download Our Mobile App</strong>
                </div>
                <button class="app-install-button">Install App</button>
                <button class="app-notice-close" onclick="closeAppNotice()">&times;</button>
            </div>
        </div>
    </div>

    <!-- TOP BAR -->
    <div class="top-bar">
        <div class="container">
            <div class="top-bar-inner">
                <span>Emergency Contact: <a href="tel:+1234567890">+1 (234) 567-890</a></span>
            </div>
        </div>
    </div>

    <!-- HEADER -->
    <header class="site-header" id="siteHeader">
        <div class="container">
            <div class="header-inner">
                <a href="#" class="brand">
                    <img src="https://via.placeholder.com/80x40?text=LOGO" alt="Rescue 2 Home Logo" class="brand-logo" width="80" height="40">
                </a>
                
                <nav class="desktop-navigation">
                    <a href="#about" class="active">About</a>
                    <a href="#services">Services</a>
                    <a href="#contact" class="nav-cta">Contact Us</a>
                </nav>

                <button class="hamburger" id="hamburgerBtn" aria-label="Toggle Menu">
                    <span></span><span></span><span></span>
                </button>
            </div>
        </div>
    </header>

    <!-- HERO SECTION -->
    <section class="hero">
        <div class="hero-background">
            <!-- Priority image: fetchpriority="high" and no lazy loading -->
            <img src="https://images.unsplash.com/photo-1548767797-d8c844163c4c?auto=format&fit=crop&w=800&q=60" 
                 alt="Animal care background" 
                 fetchpriority="high" 
                 width="800" 
                 height="500">
        </div>
        <div class="hero-blue-overlay"></div>
        <div class="container hero-inner">
            <div class="hero-content">
                <span class="eyebrow hero-eyebrow">Dedicated Care & Rescue</span>
                <h1>Compassionate Support <span>For Every Animal</span></h1>
                <div class="hero-actions">
                    <a href="#services" class="button button-white">Our Services</a>
                </div>
            </div>
        </div>
    </section>

    <!-- ABOUT SECTION -->
    <section class="section about" id="about">
        <div class="container">
            <div class="about-grid">
                <div class="about-image-wrap">
                    <!-- Offscreen image: native lazy loading enabled -->
                    <img src="https://images.unsplash.com/photo-1583511655857-d19b40a7a54e?auto=format&fit=crop&w=500&q=60" 
                         alt="About Rescue 2 Home" 
                         class="about-image" 
                         loading="lazy" 
                         width="500" 
                         height="330">
                </div>
                <div class="about-content">
                    <h2>Dedicated to Animal Welfare</h2>
                    <p>At Rescue 2 Home, we provide safe environments and attentive care for animals in need.</p>
                </div>
            </div>
        </div>
    </section>

    <!-- JAVASCRIPT -->
    <script>
        document.getElementById('hamburgerBtn').addEventListener('click', function() {
            this.classList.toggle('active');
        });
        function closeAppNotice() {
            document.getElementById('appNotice').style.display = 'none';
        }
    </script>
</body>
</html>
